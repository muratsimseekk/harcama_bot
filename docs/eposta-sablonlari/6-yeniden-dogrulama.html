<!doctype html>
<html lang="tr">
<body style="margin:0;padding:0;background:#FAF8F5;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#FAF8F5;padding:32px 16px;">
    <tr><td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#FFFFFF;border-radius:20px;padding:36px 28px;">
        <tr><td style="font-size:22px;font-weight:700;color:#D97757;padding-bottom:24px;">Paraİzi</td></tr>
        <tr><td style="font-size:20px;font-weight:700;color:#1F1E1D;padding-bottom:12px;">Doğrulama kodun</td></tr>
        <tr><td style="font-size:16px;line-height:1.55;color:#4A4741;padding-bottom:28px;">Hassas bir işlemi onaylamak için aşağıdaki kodu uygulamaya gir.</td></tr>
        <tr><td align="center" style="padding-bottom:8px;">
          <div style="display:inline-block;background:#F3E3DC;color:#1F1E1D;font-size:30px;font-weight:700;letter-spacing:6px;padding:14px 26px;border-radius:14px;">{{ .Token }}</div>
        </td></tr>
        <tr><td style="font-size:13px;line-height:1.5;color:#8F8B80;padding-top:28px;border-top:1px solid #EFEBE4;">Bu isteği sen yapmadıysan bu e-postayı görmezden gelebilirsin; hesabında bir değişiklik olmaz.</td></tr>
      </table>
      <p style="font-size:12px;color:#A8A398;margin:20px 0 0;">Paraİzi · Kişisel bütçe ve harcama takibi</p>
    </td></tr>
  </table>
</body>
</html>
