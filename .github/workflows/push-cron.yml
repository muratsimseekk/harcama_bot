name: Push bildirim cron

# Repo Secrets gerekli: API_URL (ör. https://harcama-api.onrender.com), CRON_SECRET

# Yalnız elle tetikleme (test). Zamanlama cron-job.org'da: her gün 21:00 {"tur":"gunluk"}
# (Pazar günü sunucu bunu haftalık özete çevirir). GitHub `schedule` kaldırıldı: zamanlanmış
# işler saatlerce gecikiyordu (11-11 02:06'da gecikmeli çalışıp herkese hatırlatma attı;
# haftalık özetler Pazartesi 00:56'da gidiyordu).
# Bütçe uyarıları push DEĞİL — uygulama içinde gösterilir (mobile/components/ButceUyarici.tsx).
on:
  workflow_dispatch:
    inputs:
      tur:
        description: "butce | gunluk | haftalik"
        default: "gunluk"

jobs:
  tetikle:
    runs-on: ubuntu-latest
    steps:
      - name: Tur seç
        id: tur
        run: |
          echo "tur=${{ github.event.inputs.tur }}" >> "$GITHUB_OUTPUT"

      - name: /v1/push/run çağır
        run: |
          curl -sS -X POST "${{ secrets.API_URL }}/v1/push/run" \
            -H "Content-Type: application/json" \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}" \
            -d "{\"tur\":\"${{ steps.tur.outputs.tur }}\",\"zorla\":true}" \
            --fail-with-body
