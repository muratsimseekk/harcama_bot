name: Push bildirim cron

# Repo Secrets gerekli: API_URL (ör. https://harcama-api.onrender.com), CRON_SECRET

on:
  schedule:
    - cron: "0 17 * * *"   # 20:00 Türkiye — günlük özet + bütçe uyarıları
    - cron: "0 6 * * 1"    # Pazartesi 09:00 Türkiye — haftalık özet
  workflow_dispatch:
    inputs:
      tur:
        description: "butce | gunluk | haftalik"
        default: "butce"

jobs:
  tetikle:
    runs-on: ubuntu-latest
    steps:
      - name: Tur seç
        id: tur
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tur=${{ github.event.inputs.tur }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 6 * * 1" ]; then
            echo "tur=haftalik" >> "$GITHUB_OUTPUT"
          else
            echo "tur=gunluk" >> "$GITHUB_OUTPUT"
          fi

      - name: /v1/push/run çağır
        run: |
          curl -sS -X POST "${{ secrets.API_URL }}/v1/push/run" \
            -H "Content-Type: application/json" \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}" \
            -d "{\"tur\":\"${{ steps.tur.outputs.tur }}\"}" \
            --fail-with-body

      - name: Bütçe uyarılarını da çalıştır (günlük tetikte)
        if: steps.tur.outputs.tur == 'gunluk'
        run: |
          curl -sS -X POST "${{ secrets.API_URL }}/v1/push/run" \
            -H "Content-Type: application/json" \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}" \
            -d '{"tur":"butce"}' \
            --fail-with-body
